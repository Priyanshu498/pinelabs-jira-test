name: Sync PR comments to Jira

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]

jobs:
  sync-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira issue key
        run: |
          TITLE="${{ github.event.issue.title }}"

          if [ -z "$TITLE" ]; then
            TITLE="${{ github.event.pull_request.title }}"
          fi

          ISSUE_KEY=$(echo "$TITLE" | grep -oE '[A-Z]+-[0-9]+' || true)
          echo "ISSUE_KEY=$ISSUE_KEY" >> $GITHUB_ENV

      - name: Stop if no Jira key
        run: |
          if [ -z "$ISSUE_KEY" ]; then
            echo "No Jira key found"
            exit 0
          fi

      - name: Get comment body
        run: |
          COMMENT="${{ github.event.comment.body }}"

          if [ -z "$COMMENT" ]; then
            COMMENT="${{ github.event.review.body }}"
          fi

          # If PR merged, generate merge comment
          if [ -z "$COMMENT" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            COMMENT="PR #${{ github.event.pull_request.number }} merged into ${{ github.event.pull_request.base.ref }}"
          fi

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "$COMMENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send comment to Jira
        run: |
          curl -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
          -X POST \
          -H "Content-Type: application/json" \
          --data "{
            \"body\": {
              \"type\": \"doc\",
              \"version\": 1,
              \"content\": [
                {
                  \"type\": \"paragraph\",
                  \"content\": [
                    {
                      \"type\": \"text\",
                      \"text\": \"GitHub PR update: $COMMENT\"
                    }
                  ]
                }
              ]
            }
          }" \
          "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/$ISSUE_KEY/comment"
